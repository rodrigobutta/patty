def firmaRelease = new File(System.getProperty('user.home'), 'patty-release/keystore.properties')
apply plugin: 'com.android.application'

// La versión sale del package.json de la web (la misma que se ve en Más): 1.4.2 → versionCode 10402.
def versionApp = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def partes = versionApp.tokenize('.').collect { it as int }

android {
    namespace = "ar.patty.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ar.patty.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode partes[0] * 10000 + partes[1] * 100 + partes[2]
        versionName versionApp
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // La llave de subida a Play Store vive fuera del repositorio (no se sube nunca): ~/patty-release/keystore.properties
    // con storeFile, storePassword, keyAlias y keyPassword. Sin ella, el release sale sin firmar.
    signingConfigs {
        release {
            if (firmaRelease.exists()) {
                def p = new Properties()
                firmaRelease.withInputStream { p.load(it) }
                storeFile file(p['storeFile'])
                storePassword p['storePassword']
                keyAlias p['keyAlias']
                keyPassword p['keyPassword']
            }
        }
    }
    buildTypes {
        // La de debug (la que se instala por USB) lleva la misma llave que la de la web: así una se puede instalar
        // encima de la otra. Con llaves distintas, Android rechaza la actualización.
        debug {
            if (firmaRelease.exists()) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Firmada con la llave de subida a Play Store (fuera del repo: ~/patty-release/keystore.properties).
            if (firmaRelease.exists()) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Para que el ícono de la mascota cambie de cara aunque Patty no se abra (MascotaPlugin).
    implementation "androidx.work:work-runtime:2.10.5"
    // Para AvisosPushService (la misma versión que usa el plugin de push).
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    // WorkManager usa ListenableFuture de Guava; el plugin de salud deja una versión vacía de esa clase.
    implementation "com.google.guava:guava:33.3.1-android"
    // Leer Health Connect con la app cerrada (SincroFondo, SaludFondo): las mismas versiones que el plugin de salud.
    implementation "androidx.health.connect:connect-client:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
